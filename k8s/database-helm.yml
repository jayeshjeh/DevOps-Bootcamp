apiVersion: v1
kind: Namespace
metadata:
  name: student-api

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: db-config
  namespace: student-api
data:
  POSTGRES_DB: "postgres_db"
  POSTGRES_PORT: "5432"

---

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-secrets
  namespace: student-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-cluster
  target:
    name: db-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: app-secrets
        property: POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: app-secrets
        property: POSTGRES_PASSWORD

---

apiVersion: apps/v1
kind: StatefulSet
metadata: 
  name: postgres
  namespace: student-api
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      nodeSelector:
        type: database   # change if your node labels differ
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: pg
          envFrom:
            - configMapRef:
                name: db-config
            - secretRef:
                name: db-secrets
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi

---

apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: student-api
spec:
  type: ClusterIP 
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
