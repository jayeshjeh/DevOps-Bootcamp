name: argocd

on:
  push:
    branches: milestone_9

jobs:
  build&push:
      name: Build and Push Image
      runs-on: ubuntu-latest
      env:
        IMAGE: jayesh898/flask-api
      steps:
        - name: Checkout source
          uses: actions/checkout@v5

        - name: TAG
          run: echo "TAG=${GITHUB_SHA:::7}" >> $GITHUB_TAG

        - name: Docker Build
          uses: docker/setup-buildx-action@v3

        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: build and push
          uses: docker/build-push-action@v5
          with:
            context: .
            file: ./Dockerfile
            push: true
            tags: |
              ${{ env.IMAGE }}:${{ env.TAG }}

  helm_image:
      name: Helm Image Tag
      needs: build&push
      runs_on: self-hosted
      permissions:
        contents: write
      steps:
        - name: Checkout
          uses: actions/checkout@v5
          with:
            ref: ${{ github.ref }}

        - name: Recreate TAG
          run: echo "TAG=${GITHUB_SHA::7}" >>$GITHUB_TAG

        - name: Install yq
          run: |
            curl -sL https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -o /usr/local/bin/yq
            chmod +x /usr/local/bin/yq
            yq --version

        - name: update values.yml
          run: |
            FILE="helm/application/values.yaml"
            yq -i 'image.tag = env(TAG)' "$FILE"
            echo "Updated $FILE .image.tag=${TAG}"
            git diff -- "$FILE" || true 

        - name: Commit
          run: |
            git config user.name  "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add helm/application/values.yaml
            git commit -m "flask-api image to ${TAG}" || exit 0
            git push
